name: Mise à jour RSS Charente

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

    - name: Récupération du dépôt
      uses: actions/checkout@v4


    - name: Installation Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"


    - name: Installation dépendances
      run: |
        pip install -r requirements.txt


    - name: Génération RSS
      run: |
        python scraper.py


    - name: Publication
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add rss.xml
        git commit -m "Mise à jour RSS automatique" || exit 0
        git push
